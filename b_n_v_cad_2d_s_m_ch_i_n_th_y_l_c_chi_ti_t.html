<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CAD 2D Schematic - Hệ Thống Tra Nhớt Tự Động ESP8266 (TRIOBLADE RC750)</title>
  <style>
    :root {
      --bg-cad: #060a12;
      --grid-minor: rgba(30, 58, 138, 0.22);
      --grid-major: rgba(56, 189, 248, 0.22);
      --panel-bg: rgba(11, 18, 32, 0.92);
      --border-cad: rgba(56, 189, 248, 0.35);
      --accent: #38bdf8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-cad);
      font-family: "JetBrains Mono", "Consolas", "Courier New", monospace;
      color: #e2e8f0;
    }
    #cadCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #cadCanvas:active {
      cursor: grabbing;
    }
    /* Thanh công cụ CAD trên cùng */
    .cad-topbar {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
      z-index: 20;
    }
    .cad-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      background: var(--panel-bg);
      border: 1px solid var(--border-cad);
      padding: 4px 6px;
      border-radius: 6px;
      pointer-events: auto;
      backdrop-filter: blur(6px);
    }
    .cad-title {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      padding: 0 6px;
      letter-spacing: 0.5px;
    }
    .cad-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #cbd5e1;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .cad-btn:hover {
      border-color: #38bdf8;
      color: #ffffff;
    }
    .cad-btn.active {
      background: rgba(14, 165, 233, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .cad-btn.export {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #6ee7b7;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    /* Thanh trạng thái & kiểm tra chân tiếp xúc phía dưới */
    .cad-statusbar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--border-cad);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 10.5px;
      z-index: 20;
      pointer-events: auto;
    }
    .net-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .net-badge {
      background: #0ea5e9;
      color: #060a12;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
    }
    .coords {
      color: #94a3b8;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <!-- Thanh điều khiển Layer & Xuất file CAD -->
  <div class="cad-topbar">
    <div class="cad-group">
      <span class="cad-title">AUTOCAD 2D • SƠ ĐỒ ĐẤU NỐI TOÀN HỆ THỐNG</span>
      <button class="cad-btn" id="btnFit" title="Căn giữa toàn bản vẽ">⛶ Fit All</button>
      <button class="cad-btn" id="btnSim" title="Mô phỏng đóng/ngắt chân chống">⚡ Test Mạch: CHẠY</button>
    </div>

    <div class="cad-group" id="layerBar">
      <button class="cad-btn active" data-layer="power"><span class="dot" style="background:#ef4444"></span>Nguồn 12V/5V</button>
      <button class="cad-btn active" data-layer="signal"><span class="dot" style="background:#22d3ee"></span>Tín hiệu GPIO/I2C</button>
      <button class="cad-btn active" data-layer="fluid"><span class="dot" style="background:#f59e0b"></span>Ống nhớt PU</button>
      <button class="cad-btn active" data-layer="pinout"><span class="dot" style="background:#a855f7"></span>Bảng Pinout & Dim</button>
      <button class="cad-btn export" id="btnExportDXF">⬇ Xuất .DXF (AutoCAD)</button>
      <button class="cad-btn export" id="btnExportSVG">⬇ Xuất .SVG</button>
    </div>
  </div>

  <!-- Khung vẽ CAD 2D -->
  <canvas id="cadCanvas"></canvas>

  <!-- Thanh kiểm tra thông số dây & chân tiếp xúc (Net Inspector) -->
  <div class="cad-statusbar">
    <div class="net-info" id="inspectorBox">

      <span id="netDesc">Chạm vào bất kỳ đường dây hoặc linh kiện nào trên bản vẽ để xem chi tiết chân tiếp xúc (Pinout), tiết diện dây và điện áp.</span>
    </div>
    <div class="coords" id="coordDisplay">X: 0.00 | Y: 0.00 mm • Tỷ lệ 1:1</div>
  </div>

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', () => { resize(); fitAll(); });
    resize();

    function fitAll() {
      const pad = 40;
      const w = window.innerWidth - pad * 2;
      const h = window.innerHeight - 110;
      zoom = Math.min(w / CAD_W, h / CAD_H);
      zoom = Math.max(0.22, Math.min(1.5, zoom));
      camX = CAD_W / 2;
      camY = CAD_H / 2;
    }
    fitAll();

    function worldToScreen(wx, wy) {
      return {
        x: window.innerWidth / 2 + (wx - camX) * zoom,
        y: window.innerHeight / 2 + (wy - camY) * zoom
      };
    }

    function screenToWorld(sx, sy) {
      return {
        x: camX + (sx - window.innerWidth / 2) / zoom,
        y: camY + (sy - window.innerHeight / 2) / zoom
      };
    }

    // Vẽ lưới tọa độ CAD
    function drawGrid() {
      const stepMinor = 25;
      const stepMajor = 100;
      const tl = screenToWorld(0, 0);
      const br = screenToWorld(window.innerWidth, window.innerHeight);

      const startX = Math.floor(tl.x / stepMinor) * stepMinor;
      const endX = Math.ceil(br.x / stepMinor) * stepMinor;
      const startY = Math.floor(tl.y / stepMinor) * stepMinor;
      const endY = Math.ceil(br.y / stepMinor) * stepMinor;

      ctx.lineWidth = 1;
      for (let x = startX; x <= endX; x += stepMinor) {
        const sx = worldToScreen(x, 0).x;
        ctx.strokeStyle = (x % stepMajor === 0) ? 'rgba(56, 189, 248, 0.14)' : 'rgba(30, 58, 138, 0.16)';
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, window.innerHeight);
        ctx.stroke();
      }
      for (let y = startY; y <= endY; y += stepMinor) {
        const sy = worldToScreen(0, y).y;
        ctx.strokeStyle = (y % stepMajor === 0) ? 'rgba(56, 189, 248, 0.14)' : 'rgba(30, 58, 138, 0.16)';
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.lineTo(window.innerWidth, sy);
        ctx.stroke();
      }
    }

    // Vẽ toàn bộ dây dẫn và hiệu ứng dòng chảy tín hiệu/nhớt
    function drawWires() {
      WIRES.forEach(w => {
        if (!layers[w.layer]) return;
        const netObj = NET_DATABASE[w.net];
        const isSelected = (selectedNet === w.net);

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(w.pts[0][0], w.pts[0][1]);
        for (let i = 1; i < w.pts.length; i++) {
          ctx.lineTo(w.pts[i][0], w.pts[i][1]);
        }

        if (w.layer === 'fluid') {
          // Ống dẫn nhớt PU vẽ 2 lớp (Vỏ ống + Lõi nhớt)
          ctx.strokeStyle = isSelected ? '#ffffff' : 'rgba(56, 189, 248, 0.55)';
          ctx.lineWidth = isSelected ? 9 : 7;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();

          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3.5;
          ctx.setLineDash([10, 6]);
          ctx.lineDashOffset = simRunning ? -pulseTick * 0.8 : 0;
          ctx.stroke();
        } else {
          // Dây điện & tín hiệu
          if (isSelected) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 8;
            ctx.stroke();
          }
          ctx.strokeStyle = netObj ? netObj.color : '#38bdf8';
          ctx.lineWidth = isSelected ? 3.5 : (w.layer === 'power' ? 2.6 : 2.0);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();

          // Xung chạy dọc dây khi mô phỏng mạch đang hoạt động
          if (simRunning && (w.net === 'NET_GPIO14_PUMP' || w.net === 'NET_PUMP_12V' || w.net === 'NET_I2C_SDA')) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 28]);
            ctx.lineDashOffset = -pulseTick * 1.4;
            ctx.stroke();
          }
        }

        // Vẽ mối hàn (Junction Node) tại điểm đầu và cuối
        [w.pts[0], w.pts[w.pts.length - 1]].forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt[0], pt[1], 3.8, 0, Math.PI * 2);
          ctx.fillStyle = netObj ? netObj.color : '#fff';
          ctx.fill();
        });

        ctx.restore();
      });
    }

    // Vẽ các khối linh kiện điện tử & chân tiếp xúc (IC Packages)

        // Thanh tiêu đề linh kiện

        ctx.fillStyle = '#38bdf8';

        if (b.id === 'MCU_ESP8266') {
          // Vẽ chip Wi-Fi ESP-12E và ăng-ten PCB
          ctx.strokeStyle = '#475569';
          ctx.strokeRect(b.x + 62, b.y + 58, 76, 95);
          ctx.fillStyle = '#22d3ee';
          ctx.font = 'bold 9.5px monospace';
          ctx.fillText('ESP-12E', b.x + 76, b.y + 105);
          ctx.fillStyle = simRunning ? '#10b981' : '#ef4444';
          ctx.fillText(simRunning ? 'STATUS: RUN' : 'STATUS: LOCK', b.x + 66, b.y + 125);
        } else if (b.id === 'PUMP_G168') {
          // Vẽ 3 con lăn bơm nhu động xoay
          const cx = b.x + 75, cy = b.y + 115;
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(cx, cy, 34, 0, Math.PI * 2);
          ctx.stroke();
          for (let i = 0; i < 3; i++) {
            const ang = (simRunning ? pulseTick * 0.06 : 0) + (i * Math.PI * 2) / 3;
            const rx = cx + Math.cos(ang) * 20;
            const ry = cy + Math.sin(ang) * 20;
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(rx, ry, 7, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (b.id === 'SENS_REED') {
          // Vẽ trạng thái tiếp điểm công tắc từ chân chống
          ctx.fillStyle = simRunning ? '#10b981' : '#ef4444';
          ctx.font = 'bold 10px monospace';
          ctx.fillText(
            simRunning ? 'CHỐNG GẠT LÊN -> HỞ (HIGH)' : 'HẠ CHỐNG -> NỐI GND (LOW)',
            b.x + 12, b.y + 68
          );
        }

        // Vẽ từng chân tiếp xúc (Contact Pins)
        b.pins.forEach(p => {
          ctx.fillStyle = p.col;
          ctx.strokeStyle = '#060a12';
          ctx.lineWidth = 1.2;

          // Pad đồng tiếp xúc
          ctx.beginPath();
          ctx.rect(p.x - 5, p.y - 5, 10, 10);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 9.5px monospace';
          if (p.side === 'left') {
            ctx.textAlign = 'left';
            ctx.fillText(p.label, p.x + 9, p.y + 3);
          } else {
            ctx.textAlign = 'right';
            ctx.fillText(p.label, p.x - 9, p.y + 3);
          }
        });

        ctx.restore();
      });
    }

    function render() {
      pulseTick++;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      drawGrid();

      ctx.save();
      ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-camX, -camY);

      drawDrawingBorder();
      drawPinoutTableAndDims();
      drawFluidSystem();
      drawWires();
      drawDiscreteSymbols();
      drawBlocks();

      ctx.restore();
      requestAnimationFrame(render);
    }
    render();

    // Bắt sự kiện chọn nhánh dây hoặc linh kiện trên bản vẽ CAD
    function pickElementAt(wx, wy) {
      // Kiểm tra chạm vào khối linh kiện
      for (const b of BLOCKS) {
        if (wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h) {
          selectNet(b.net);
          return;
        }
      }
      // Kiểm tra khoảng cách tới các đoạn dây
      for (const w of WIRES) {
        if (!layers[w.layer]) continue;
        for (let i = 0; i < w.pts.length - 1; i++) {
          const ax = w.pts[i][0], ay = w.pts[i][1];
          const bx = w.pts[i + 1][0], by = w.pts[i + 1][1];
          const dist = distToSegment(wx, wy, ax, ay, bx, by);
          if (dist < 14) {
            selectNet(w.net);
            return;
          }
        }
      }
      selectedNet = null;
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    function selectNet(netKey) {
      selectedNet = netKey;
      const info = NET_DATABASE[netKey];
      if (info) {
        const badge = document.getElementById('netName');
        badge.textContent = info.name;
        badge.style.background = info.color;
        document.getElementById('netDesc').textContent = info.spec;
      }
    }

    // Tương tác Pan & Zoom chuẩn phần mềm CAD
    let pointerDownPos = { x: 0, y: 0 };
    canvas.addEventListener('pointerdown', (e) => {
      isPanning = true;
      startPanX = e.clientX;
      startPanY = e.clientY;
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
      mouseCAD = screenToWorld(e.clientX, e.clientY);
      document.getElementById('coordDisplay').textContent =
        `X: ${mouseCAD.x.toFixed(1)} | Y: ${mouseCAD.y.toFixed(1)} mm • Zoom: ${Math.round(zoom * 100)}%`;

      if (!isPanning) return;
      camX -= (e.clientX - startPanX) / zoom;
      camY -= (e.clientY - startPanY) / zoom;
      startPanX = e.clientX;
      startPanY = e.clientY;
    });

    window.addEventListener('pointerup', (e) => {
      if (isPanning && Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) < 6) {
        const pt = screenToWorld(e.clientX, e.clientY);
        pickElementAt(pt.x, pt.y);
      }
      isPanning = false;
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const before = screenToWorld(e.clientX, e.clientY);
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      zoom = Math.max(0.2, Math.min(3.5, zoom * factor));
      const after = screenToWorld(e.clientX, e.clientY);
      camX += before.x - after.x;
      camY += before.y - after.y;
    }, { passive: false });

    // Sự kiện các nút điều khiển Layer & Mô phỏng
    document.getElementById('btnFit').onclick = fitAll;

    const btnSim = document.getElementById('btnSim');
    btnSim.onclick = () => {
      simRunning = !simRunning;
      btnSim.textContent = simRunning ? '⚡ Test Mạch: CHẠY' : '🛑 Test Mạch: HẠ CHỐNG (NGẮT)';
      btnSim.classList.toggle('active', !simRunning);
    };

    document.querySelectorAll('#layerBar [data-layer]').forEach(btn => {
      btn.onclick = () => {
        const k = btn.getAttribute('data-layer');
        layers[k] = !layers[k];
        btn.classList.toggle('active', layers[k]);
      };
    });

    // =========================================================================
    // TRÌNH XUẤT FILE AUTOCAD (.DXF) & VECTOR (.SVG) TRỰC TIẾP TRÊN TRÌNH DUYỆT
    // =========================================================================
    document.getElementById('btnExportDXF').onclick = () => {
      let dxf = "0\nSECTION\n2\nENTITIES\n";
      const addLine = (x1, y1, x2, y2, layer) => {
        dxf += `0\nLINE\n8\n${layer}\n10\n${x1}\n20\n${-y1}\n11\n${x2}\n21\n${-y2}\n`;
      };
      const addRect = (x, y, w, h, layer) => {
        addLine(x, y, x + w, y, layer);
        addLine(x + w, y, x + w, y + h, layer);
        addLine(x + w, y + h, x, y + h, layer);
        addLine(x, y + h, x, y, layer);
      };
      const addText = (x, y, h, txt, layer) => {
        dxf += `0\nTEXT\n8\n${layer}\n10\n${x}\n20\n${-y}\n40\n${h}\n1\n${txt}\n`;
      };

      addRect(20, 20, CAD_W - 40, CAD_H - 40, "BORDER");
      BLOCKS.forEach(b => {
        addRect(b.x, b.y, b.w, b.h, "COMPONENTS");
        addText(b.x + 8, b.y + 18, 9, b.title, "TEXT");
        b.pins.forEach(p => {
          addRect(p.x - 4, p.y - 4, 8, 8, "PINS");
          addText(p.x + (p.side === 'left' ? 8 : -65), p.y + 3, 7, p.label, "PINS");
        });
      });
      WIRES.forEach(w => {
        for (let i = 0; i < w.pts.length - 1; i++) {
          addLine(w.pts[i][0], w.pts[i][1], w.pts[i + 1][0], w.pts[i + 1][1], w.net);
        }
      });
      dxf += "0\nENDSEC\n0\nEOF\n";

      const blob = new Blob([dxf], { type: 'application/dxf' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'So_Do_CAD_2D_Tra_Nhot_ESP8266.dxf';
      a.click();
    };

    document.getElementById('btnExportSVG').onclick = () => {
      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${CAD_W} ${CAD_H}" width="100%" height="100%" style="background:#060a12;font-family:monospace">`;
      svg += `<rect x="20" y="20" width="${CAD_W - 40}" height="${CAD_H - 40}" fill="none" stroke="#38bdf8" stroke-width="2"/>`;
      WIRES.forEach(w => {
        const col = NET_DATABASE[w.net]?.color || '#38bdf8';
        const pts = w.pts.map(p => p.join(',')).join(' ');
        svg += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${w.layer === 'fluid' ? 5 : 2.5}"/>`;
      });
      BLOCKS.forEach(b => {
        svg += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>`;
        svg += `<text x="${b.x + 10}" y="${b.y + 18}" fill="#38bdf8" font-size="11" font-weight="bold">${b.title}</text>`;
        svg += `<text x="${b.x + 10}" y="${b.y + 32}" fill="#94a3b8" font-size="9.5">${b.sub}</text>`;
        b.pins.forEach(p => {
          svg += `<rect x="${p.x - 4}" y="${p.y - 4}" width="8" height="8" fill="${p.col}"/>`;
          const tx = p.side === 'left' ? p.x + 8 : p.x - 8;
          const anchor = p.side === 'left' ? 'start' : 'end';
          svg += `<text x="${tx}" y="${p.y + 3}" fill="#f8fafc" font-size="9" text-anchor="${anchor}">${p.label}</text>`;
        });
      });
      svg += `</svg>`;

      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'So_Do_CAD_2D_Tra_Nhot_ESP8266.svg';
      a.click();
    };
  </script>
</body>
